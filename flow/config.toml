# flow configuration
# https://github.com/programmersd21/flow

refresh     = "100ms"     # sampling interval (e.g. "100ms", "250ms", "1s")
history     = 60       # seconds of sparkline history
theme       = "default"
unit        = "auto"     # auto | kb | mb | gb
interface   = "auto"     # auto or interface name (e.g. "eth0", "wlan0")
no_color    = false
bits        = false       # display in bits/sec instead of bytes/sec
ping_target = "1.1.1.1"     # host for latency measurement
