<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- 1. Основной алиас: monospace → JetBrains Mono -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
    </prefer>
    <!-- Fallback: если JB Mono не может отрендерить глиф, 
         используем качественные моноширинные шрифты -->
    <accept>
      <family>Fira Code</family>
      <family>Source Code Pro</family>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
    </accept>
    <!-- Последний рубеж для символов, которых нет ни в одном выше -->
    <default>
      <family>Symbols Nerd Font Mono</family>
    </default>
  </alias>

  <!-- 2. Улучшаем рендеринг JetBrains Mono глобально -->
  <match target="font">
    <test name="family" compare="eq"><string>JetBrains Mono</string></test>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- 3. Предотвращаем использование bitmap-шрифтов (частая причина "отвратительности") -->
  <selectfont>
    <rejectfont>
      <glob>*.pcf</glob>
      <glob>*.bdf</glob>
      <glob>*.snf</glob>
    </rejectfont>
  </selectfont>

</fontconfig>
